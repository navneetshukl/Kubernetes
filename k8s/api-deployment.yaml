apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      containers:
      - name: notification-api
        image: notification-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080