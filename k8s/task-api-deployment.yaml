apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-deployment
  #namespace: task-system
  labels:
    app: task-api
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: task-api-pod
  template:
    metadata:
      labels:
        app: task-api-pod
    spec:
      containers:
      - name: task-api
        image: task-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DSN
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DSN